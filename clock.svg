<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="180" height="180" role="img" aria-label="Animated clock">
  <defs>
    <radialGradient id="face" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </radialGradient>
  </defs>

  <!-- face -->
  <circle cx="100" cy="100" r="92" fill="url(#face)" stroke="#8B5CF6" stroke-width="4"/>

  <!-- minor hour ticks -->
  <g stroke="#565f89" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(30 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(60 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(120 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(150 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(210 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(240 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(300 100 100)"/>
    <line x1="100" y1="14" x2="100" y2="24" transform="rotate(330 100 100)"/>
  </g>

  <!-- major quarter ticks (12/3/6/9) -->
  <g stroke="#bb9af7" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(0 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(90 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(180 100 100)"/>
    <line x1="100" y1="12" x2="100" y2="26" transform="rotate(270 100 100)"/>
  </g>

  <!-- hour hand -->
  <rect x="96.5" y="56" width="7" height="52" rx="3.5" fill="#c0caf5">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="43200s" repeatCount="indefinite"/>
  </rect>

  <!-- minute hand -->
  <rect x="98" y="36" width="4" height="72" rx="2" fill="#8B5CF6">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3600s" repeatCount="indefinite"/>
  </rect>

  <!-- second hand -->
  <g>
    <rect x="99.1" y="28" width="1.8" height="84" rx="0.9" fill="#f7768e"/>
    <circle cx="100" cy="118" r="4" fill="#f7768e"/>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="60s" repeatCount="indefinite"/>
  </g>

  <!-- center cap -->
  <circle cx="100" cy="100" r="6" fill="#8B5CF6"/>
  <circle cx="100" cy="100" r="2.5" fill="#1a1b27"/>
</svg>
