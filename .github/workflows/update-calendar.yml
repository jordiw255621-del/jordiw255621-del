name: Update Calendar Activity
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay under load)
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests icalendar recurring-ical-events
      - run: python scripts/calendar_activity.py
        env:
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --quiet --cached; then echo "no change"; exit 0; fi
          git commit -m "chore: update calendar activity"
          git pull --rebase --autostash origin main
          git push
