name: Update Sydney Time
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may still delay/skip under load)
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_readme.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --quiet --cached; then echo "no change"; exit 0; fi
          git commit -m "chore: update Sydney time"
          git pull --rebase --autostash origin main
          git push
